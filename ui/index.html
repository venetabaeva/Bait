<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BAIT – Let’s Analyse It</title>
  <style>
    body {
      background: #1e1e1e;
      color: #e9e9e9;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 24px;
    }
    .logo {
      margin-top: 12px;
    }
    .hello {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0 24px 0;
      text-align: center;
    }
    .chat {
      width: 100%;
      max-width: 760px;
      background: #2b2b2b;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .msg {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .user {
      background: #3a3a3a;
      color: #f0f0f0;
      align-self: flex-end;
    }
    .bot {
      background: #424242;
      color: #f3f3f3;
      align-self: flex-start;
    }
    .input {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .input input {
      flex: 1;
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 8px;
      color: #eee;
      padding: 12px 14px;
    }
    .input button {
      background: #6b6b6b;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0 18px;
      height: 44px;
      cursor: pointer;
    }
    .input button:hover {
      background: #7a7a7a;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/static/bait_logo.png" alt="bait" style="height:40px"/>
  </div>
  <div class="hello">Hello! Let’s Analyse It.</div>

  <div class="chat">
    <div id="messages"></div>
    <div class="input">
      <input id="userInput" placeholder="Ask anything..."/>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage(){
      const el=document.getElementById('userInput');
      const txt=(el.value||'').trim(); 
      if(!txt) return;
      append(txt,'user'); 
      el.value='';
      try{
        const r=await fetch('/chat',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({message:txt})
        });
        const d=await r.json();
        let reply=d.response;
        if(typeof reply==='object'){ reply=JSON.stringify(reply,null,2); }
        append(reply||'No response','bot');
      }catch(e){
        append('Error connecting to server.','bot');
      }
    }
    function append(text,who){
      const m=document.getElementById('messages'); 
      const d=document.createElement('div'); 
      d.className='msg '+(who==='user'?'user':'bot'); 
      d.textContent=text; 
      m.appendChild(d); 
      m.scrollTop=m.scrollHeight; 
    }
    document.getElementById('userInput').addEventListener('keydown',e=>{
      if(e.key==='Enter') sendMessage();
    });
  </script>
</body>
</html>

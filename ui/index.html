<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bait Advisor</title>
  <style>
    :root{
      --bg:#121212;
      --panel:#2a2a2a;
      --panel-2:#1e1e1e;
      --text:#f1f1f1;
      --muted:#cfcfcf;
      --accent:#d9d9d9; /* НИКАКВО синьо */
      --accent-2:#bdbdbd;
      --input:#303030;  /* по-тъмна лента за чат */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:32px 16px;
      gap:16px;
    }
    .wrap{
      width:min(820px, 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }
    .logo{
      display:flex; align-items:center; justify-content:center;
      height:56px;
    }
    .logo img{height:40px}

    .headline{
      margin-top:6px;
      font-size:20px;
      color:var(--muted);
      text-align:center;
    }

    .chat{
      width:100%;
      background:var(--panel);
      border-radius:12px;
      padding:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:420px;
    }

    .messages{
      flex:1;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:6px;
      background:var(--panel-2);
      border-radius:10px;
    }

    .msg{
      padding:10px 12px;
      border-radius:8px;
      line-height:1.45;
      font-size:15px;
      max-width:85%;
      white-space:pre-wrap;
    }
    .msg.user{
      margin-left:auto;
      background:var(--accent);
      color:#111;
    }
    .msg.bot{
      background:#3a3a3a;
      color:var(--text);
    }

    .input{
      display:flex; gap:8px;
      background:var(--input);
      border-radius:10px;
      padding:8px;
    }
    .input input{
      flex:1;
      background:transparent;
      border:none;
      outline:none;
      color:var(--text);
      font-size:16px;
      padding:10px 12px;
    }
    .input button{
      background:var(--accent-2);
      color:#111;
      border:none;
      border-radius:8px;
      padding:10px 14px;
      font-size:15px;
      cursor:pointer;
    }
    .input button:hover{filter:brightness(.95)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="/static/bait_logo.png" alt="bait">
    </div>
    <div class="headline">Hello! Let’s Analyse It.</div>

    <div class="chat">
      <div id="messages" class="messages"></div>
      <div class="input">
        <input id="userInput" type="text" placeholder="Ask anything…">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    function push(text, who){
      const box=document.getElementById('messages');
      const el=document.createElement('div');
      el.className=`msg ${who}`;
      el.textContent=text;
      box.appendChild(el);
      box.scrollTop=box.scrollHeight;
    }

    async function sendMessage(){
      const inp=document.getElementById('userInput');
      const msg=inp.value.trim();
      if(!msg) return;
      push(msg, 'user');
      inp.value='';

      try{
        const r = await fetch('/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({message:msg})
        });
        const data = await r.json();

        let reply = data.response;
        // ако бекендът върне обект (краен резултат), го сведем до текст
        if (reply && typeof reply === 'object'){
          reply = reply.text || reply.summary || JSON.stringify(reply, null, 2);
        }
        push(reply || 'No response from server', 'bot');
      }catch(e){
        push('Error connecting to server.', 'bot');
      }
    }

    window.addEventListener('DOMContentLoaded', ()=>{
      const i=document.getElementById('userInput');
      i.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
    });
  </script>
</body>
</html>

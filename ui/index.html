<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bait Advisor</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #f1f1f1;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .logo-container img {
      max-width: 200px;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      height: 70vh;
      background-color: #2e2e2e;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 10px rgba(0, 0, 0, 0.5);
    }

    .messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .message {
      margin: 5px 0;
      padding: 10px;
      border-radius: 5px;
      line-height: 1.4;
    }

    .user {
      background-color: #007acc;
      text-align: right;
    }

    .bot {
      background-color: #444;
      color: #f1f1f1;
      text-align: left;
    }

    .input-container {
      display: flex;
      margin-top: 10px;
    }

    .input-container input {
      flex-grow: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      font-size: 16px;
    }

    .input-container button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #007acc;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .input-container button:hover {
      background-color: #005999;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="/static/bait_logo.png" alt="Bait Logo" />
  </div>
  <div class="chat-container"> 
    <div class="messages" id="messages">
      <div class="message bot">Hello! Let's Analyse It.</div>
    </div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Ask anything..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
  <script>
    async function sendMessage() {
      const inputField = document.getElementById("userInput");
      const userMessage = inputField.value.trim();
      if (!userMessage) return;

      appendMessage(userMessage, "user");
      inputField.value = "";

      try {
        const response = await fetch("https://bait-4ahw.onrender.com/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMessage })
        });
        const data = await response.json();
	let reply = data.response;
        If (typeof reply === "object") {
		reply = JSON.stringify(reply, null, 2);
}
        appendMessage(data.response || "No response from server", "bot");
      } catch (error) {
        appendMessage("Error connecting to server.", "bot");
      }
    }

    function appendMessage(text, sender) {
      const messagesDiv = document.getElementById("messages");
      const messageEl = document.createElement("div");
      messageEl.classList.add("message", sender);
      messageEl.textContent = text;
      messagesDiv.appendChild(messageEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    window.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("userInput");
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") sendMessage();
  });
});
  </script>
</body>
</html>
